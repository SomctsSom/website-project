# Website Core — local Apache vhost
# Port: 8090  URL: http://127.0.0.1:8090/health
# Document root is public/ only.

Listen 8090

<VirtualHost *:8090>
    ServerName localhost
    DocumentRoot /var/www/html/project/wc/public

    <Directory /var/www/html/project/wc/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        CGIPassAuth On
        SetEnvIfNoCase Authorization "^(.+)$" HTTP_AUTHORIZATION=$1
    </Directory>

    <DirectoryMatch "^/var/www/html/project/wc/(config|database|includes|storage|uploads|bin|api)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/wms-wc-8090-error.log
    CustomLog ${APACHE_LOG_DIR}/wms-wc-8090-access.log combined
</VirtualHost>
