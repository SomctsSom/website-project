# Public Website — local Apache vhost
# Port: 8092  URL: http://127.0.0.1:8092/

Listen 8092

<VirtualHost *:8092>
    ServerName localhost
    DocumentRoot /var/www/html/project/pw/public

    <Directory /var/www/html/project/pw/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <DirectoryMatch "^/var/www/html/project/pw/(includes|pages)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/wms-pw-8092-error.log
    CustomLog ${APACHE_LOG_DIR}/wms-pw-8092-access.log combined
</VirtualHost>
