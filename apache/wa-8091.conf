# Website Admin — local Apache vhost
# Port: 8091  URL: http://127.0.0.1:8091/login

Listen 8091

<VirtualHost *:8091>
    ServerName localhost
    DocumentRoot /var/www/html/project/wa/public

    <Directory /var/www/html/project/wa/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <DirectoryMatch "^/var/www/html/project/wa/(includes|pages)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/wms-wa-8091-error.log
    CustomLog ${APACHE_LOG_DIR}/wms-wa-8091-access.log combined
</VirtualHost>
